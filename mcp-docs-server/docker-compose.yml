version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: devtron-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-devtron_docs}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  docs-api:
    build: .
    container_name: devtron-docs-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENV=${ENV:-production}
      - DOCS_REPO_URL=${DOCS_REPO_URL:-https://github.com/devtron-labs/devtron}
      - DOCS_PATH=/data/devtron-docs
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-devtron_docs}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Persist documentation
      - devtron-docs:/data/devtron-docs
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  devtron-docs:
    driver: local
  postgres-data:
    driver: local

